info:
  name: Follow Club
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseURL}}/api/clubs/{{clubId}}/follow"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("the student now follows the club", function () {
          expect(body.clubId).to.equal(bru.getVar("clubId"));
          expect(body.isFollowing).to.equal(true);
          expect(body.followerCount).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The follow route toggles: the first call follows the club.
