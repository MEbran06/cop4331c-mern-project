info:
  name: Forgot Password
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseURL}}/api/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{studentEmail}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.getBody().devResetToken) {
          bru.setVar("resetToken", res.getBody().devResetToken);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns a reset token for testing", function () {
          expect(body.devResetToken).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Asks for a password reset for the student from Register Student and saves {{resetToken}}.
