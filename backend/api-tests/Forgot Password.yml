meta:
  name: Forgot Password
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseURL}}/api/auth/forgot-password"
  body: json
  auth: inherit

body:json:
  {
    "email": "student@ucf.edu"
  }

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns reset token for dev testing", function () {
          expect(body).to.have.property("devResetToken");
          bru.setEnvVar("resetToken", body.devResetToken);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Request a password reset token/code for an account email.
