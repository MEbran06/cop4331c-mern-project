info:
  name: Reset Password
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseURL}}/api/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "{{resetToken}}",
        "newPassword": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("confirms the password was reset", function () {
          expect(res.getBody().message).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Uses {{resetToken}} from Forgot Password to set the password. It sets the same password, so later runs still work.
