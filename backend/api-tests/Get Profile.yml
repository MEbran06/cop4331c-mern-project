info:
  name: Get Profile
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/api/users/profile"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns the logged-in student", function () {
          expect(body.role).to.equal("student");
          expect(body.user.id).to.equal(bru.getVar("userId"));
          expect(body.user.email).to.equal(bru.getVar("studentEmail"));
        });

        test("a new student follows no clubs yet", function () {
          expect(body.followingCount).to.equal(0);
          expect(body.following).to.be.an("array").that.is.empty;
        });

        test("never returns the password hash", function () {
          expect(body.user).to.not.have.property("passwordHash");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Protected profile route returning role-specific user details.
