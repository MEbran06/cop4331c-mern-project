info:
  name: Register Student
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/users"
  body:
    type: json
    data: |-
      {
        "role": "student",
        "name": "Test Student",
        "email": "{{studentEmail}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // The same email can't register twice (409), so each run uses a new one
        bru.setVar("studentEmail", `student-${Date.now()}@example.com`);
    - type: after-response
      code: |-
        // The student's token and id are used by the requests that follow
        if (res.getStatus() === 201) {
          bru.setVar("token", res.getBody().token);
          bru.setVar("userId", res.getBody().user.id);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("returns a token and the new student", function () {
          expect(body.token).to.be.a("string").and.not.be.empty;
          expect(body.user.id).to.be.a("string");
          expect(body.user.email).to.equal(bru.getVar("studentEmail"));
          expect(body.user.role).to.equal("student");
        });

        test("never returns the password or its hash", function () {
          expect(body.user).to.not.have.property("password");
          expect(body.user).to.not.have.property("passwordHash");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new student account and saves {{token}} and {{userId}} for later requests.
