info:
  name: Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{studentEmail}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Replace the token from sign-up with the one from logging in
        if (res.getStatus() === 200) {
          bru.setVar("token", res.getBody().token);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns a token", function () {
          expect(body.token).to.be.a("string").and.not.be.empty;
        });

        test("returns the student who logged in", function () {
          expect(body.user.id).to.equal(bru.getVar("userId"));
          expect(body.user.email).to.equal(bru.getVar("studentEmail"));
        });

        test("never returns the password or its hash", function () {
          expect(body.user).to.not.have.property("password");
          expect(body.user).to.not.have.property("passwordHash");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Logs in as the student from Register Student and saves {{token}}.
