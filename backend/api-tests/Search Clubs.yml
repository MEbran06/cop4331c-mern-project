meta:
  name: Search Clubs
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseURL}}/api/clubs?q=&followedOnly=false"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns an array of clubs", function () {
          expect(body).to.have.property("clubs");
          expect(body.clubs).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Search and browse clubs with optional query parameter and follow status.
