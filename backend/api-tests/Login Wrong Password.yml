info:
  name: Login Wrong Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{studentEmail}}",
        "password": "not-the-password"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401 Unauthorized", function () {
          expect(res.getStatus()).to.equal(401);
        });

        test("doesn't hand out a token", function () {
          expect(res.getBody()).to.not.have.property("token");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A wrong password is refused with the same 401 as an unknown email.
